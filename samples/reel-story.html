<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Reel Story</title>
<style>body{margin:0;display:grid;place-items:center;height:100vh;background:#111;color:#fff;font-family:system-ui}.phone{width:min(360px,92vw);aspect-ratio:9/16;border:2px solid #444;border-radius:22px;overflow:hidden;position:relative;background:#000}.bar{display:flex;gap:4px;padding:8px;position:absolute;top:0;left:0;right:0}.bar span{height:4px;flex:1;background:#ffffff55;border-radius:999px}.bar span.active{background:#fff}.slide{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:2rem;font-size:1.4rem;opacity:0;transition:.5s}.slide.active{opacity:1}</style></head><body>
<div class='phone'>
<div class='bar'><span></span><span></span><span></span></div>
<div class='slide active'>Happy Birthday<br>Nandini 💕</div>
<div class='slide'>To my Lolodile 🫶<br>You are my favorite person.</div>
<div class='slide'>June 4 Surprise 🎉<br>Tonight is your special date.</div>
</div>
<script>
const slides=[...document.querySelectorAll('.slide')], bars=[...document.querySelectorAll('.bar span')];let i=0;
setInterval(()=>{slides[i].classList.remove('active');bars[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active');bars[i].classList.add('active')},2200);bars[0].classList.add('active');
</script></body></html>
